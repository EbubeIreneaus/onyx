name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-ci:
    name: API Checks & Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - name: Install API dependencies
        working-directory: api
        run: uv sync

      - name: Run API tests
        working-directory: api
        run: uv run pytest -q

  web-ci:
    name: Web Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install

      - name: Lint web
        working-directory: web
        run: pnpm run lint

      - name: Typecheck web
        working-directory: web
        run: pnpm run typecheck

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [api-ci, web-ci]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onyx
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U onyx -d onyx"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - name: Install API dependencies
        working-directory: api
        run: uv sync

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies if cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      - name: Start web app
        working-directory: web
        run: pnpm run dev --host 127.0.0.1 --port 3000 > /tmp/onyx-web.log 2>&1 &

      - name: Start API app
        working-directory: api
        run: uv run uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/onyx-api.log 2>&1 &

      - name: Wait for services
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/api/v1/auth/me >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1

      - name: Run Playwright tests
        working-directory: web
        run: pnpm run test:e2e

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker-check:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose Stack
        run: docker compose build

      - name: Verify Compose Stack Startup
        run: docker compose up -d

      - name: Verify Compose Services Health
        run: docker compose ps
