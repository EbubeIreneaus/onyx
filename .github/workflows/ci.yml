name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_URL: 'sqlite+aiosqlite:///:memory:'
  JWT_SECRET: test-jwt-secret-key-1234567890
  JWT_ALGORITHM: HS256
  DOMAIN_NAME: localhost:3000
  ONYX_ADMIN_EMAIL: admin@onyx.com
  ONYX_ADMIN_PASS: 178420443
  PAYSTACK_SECRET: test_paystack_secret
  PAYSTACK_PUBLIC: test_paystack_public
  REDIS_URL: redis://localhost:6379
  MAIL_USER: test@example.com
  MAIL_HOST: smtp.test
  MAIL_PASS: test
  MAIL_FROM: test@example.com
  MAIL_FROM_NAME: Onyx
  CLOUDINARY_NAME: test
  CLOUDINARY_SECRET: test
  CLOUDINARY_KEY: test
  STRIPE_SECRET: test_stripe_secret
  STRIPE_HOOK_SECRET: test_stripe_hook_secret

jobs:
  api-ci:
    name: API Checks & Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install API dependencies
        working-directory: api
        run: uv sync

      - name: Run API tests
        working-directory: api
        run: uv run pytest -q

  web-ci:
    name: Web Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install

      - name: Lint web
        working-directory: web
        run: pnpm run lint

      - name: Typecheck web
        working-directory: web
        run: pnpm run typecheck

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [api-ci, web-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies if cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright tests
        working-directory: web
        run: pnpm run test:e2e

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7


 